<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tech | Painel de Administração</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS CYBERPUNK (PADRÃO NEXUS TECH) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        :root {
            --bg-dark: #06040d;
            --bg-card: rgba(18, 12, 36, 0.85);
            --primary-purple: #9d4edd;
            --neon-purple: #c77dff;
            --dark-purple: #240046;
            --accent-cyan: #00f5d4;
            --accent-red: #ff4d6d;
            --text-light: #f8f9fa;
            --text-muted: #a0a0b8;
            --border-glow: rgba(199, 125, 255, 0.25);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* HEADER */
        header {
            background: rgba(6, 4, 13, 0.9);
            border-bottom: 1px solid var(--border-glow);
            padding: 1.2rem 0;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: var(--neon-purple);
        }

        .badge-admin {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid rgba(255, 0, 127, 0.4);
            color: #ff4d6d;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-site {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-site:hover {
            opacity: 0.8;
        }

        /* PAINEL E FORMULÁRIO */
        .grid-admin {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
        }

        @media (max-width: 850px) {
            .grid-admin { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 1.8rem;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card h2 {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 0.6rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            background: rgba(6, 4, 13, 0.9);
            border: 1px solid rgba(199, 125, 255, 0.2);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary-purple), var(--dark-purple));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(199, 125, 255, 0.6);
        }

        /* TABELA DE REPAROS */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 0.9rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 1rem 0.9rem;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tag-status {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-recebido { background: rgba(255, 190, 11, 0.15); color: #ffbe0b; border: 1px solid rgba(255, 190, 11, 0.3); }
        .status-analise { background: rgba(0, 180, 216, 0.15); color: #00b4d8; border: 1px solid rgba(0, 180, 216, 0.3); }
        .status-reparo { background: rgba(197, 125, 255, 0.15); color: var(--neon-purple); border: 1px solid rgba(197, 125, 255, 0.3); }
        .status-pronto { background: rgba(0, 245, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 245, 212, 0.3); }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 0.5rem;
            transition: transform 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-wrapper">
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="#" class="logo">NEXUS <span>ADMIN</span></a>
                <span class="badge-admin">PAINEL PRIVADO</span>
            </div>
            <a href="index.html" class="btn-site">🌐 Ir para o Site dos Clientes</a>
        </div>
    </header>

    <div class="container">
        <div class="grid-admin">
            
            <div class="card">
                <h2>📝 Cadastrar / Atualizar OS</h2>
                <form id="order-form">
                    <div class="form-group">
                        <label>Código da OS (Identificador do Cliente)</label>
                        <input type="text" id="os-code" class="form-control" placeholder="Ex: NX-1020" required uppercase>
                    </div>

                    <div class="form-group">
                        <label>Nome do Cliente</label>
                        <input type="text" id="os-client" class="form-control" placeholder="Ex: João da Silva" required>
                    </div>

                    <div class="form-group">
                        <label>Aparelho / Equipamento</label>
                        <input type="text" id="os-product" class="form-control" placeholder="Ex: iPhone 13 Pro Max" required>
                    </div>

                    <div class="form-group">
                        <label>Status Atual do Serviço</label>
                        <select id="os-status" class="form-control" required>
                            <option value="Recebido">1. Recebido na Loja</option>
                            <option value="Em Análise">2. Em Análise / Orçamento</option>
                            <option value="Em Reparo">3. Em Reparo / Manutenção</option>
                            <option value="Pronto para Retirada">4. Pronto para Retirada</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">💾 Salvar na Nuvem</button>
                </form>
            </div>

            <div class="card">
                <h2>📋 Aparelhos Cadastrados (Tempo Real)</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Cliente</th>
                                <th>Aparelho</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando dados do Firebase...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 🔐 1. TRAVA DE SENHA SIMPLES
        const SENHA_CORRETA = "admin123"; // 👈 Troque sua senha aqui se desejar!
        const acesso = prompt("Digite a senha de administrador da Nexus Tech:");

        if (acesso !== SENHA_CORRETA) {
            alert("Acesso Negado!");
            window.location.href = "index.html";
        }

        // 🔥 2. SUAS CHAVES DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDYPVAg0_wbgDq2VHmn8AMnnp1zRZ77xlE",
            authDomain: "nexustech-6f823.firebaseapp.com",
            projectId: "nexustech-6f823",
            storageBucket: "nexustech-6f823.firebasestorage.app",
            messagingSenderId: "592661621874",
            appId: "1:592661621874:web:7eecff538edebb8381e6eb",
            measurementId: "G-LTGXYTQZFX"
        };

        // Inicializando Firebase & Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const form = document.getElementById('order-form');
        const tbody = document.getElementById('orders-table-body');

        // 💾 3. SALVAR / ATUALIZAR REPARO NO FIREBASE
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const code = document.getElementById('os-code').value.trim().toUpperCase();
            const client = document.getElementById('os-client').value.trim();
            const product = document.getElementById('os-product').value.trim();
            const status = document.getElementById('os-status').value;

            db.collection("reparos").doc(code).set({
                client: client,
                product: product,
                status: status,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert(`Ordem ${code} salva com sucesso!`);
                form.reset();
            })
            .catch((error) => {
                console.error("Erro ao salvar: ", error);
                alert("Erro ao salvar no Firebase!");
            });
        });

        // 🔄 4. LISTAR REPAROS EM TEMPO REAL (ONSNAPSHOT)
        db.collection("reparos").onSnapshot((snapshot) => {
            tbody.innerHTML = '';

            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Nenhum reparo cadastrado ainda.</td></tr>';
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                const code = doc.id;

                let statusClass = 'status-recebido';
                if (item.status === 'Em Análise') statusClass = 'status-analise';
                if (item.status === 'Em Reparo') statusClass = 'status-reparo';
                if (item.status === 'Pronto para Retirada') statusClass = 'status-pronto';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color: var(--accent-cyan);">${code}</strong></td>
                    <td>${item.client}</td>
                    <td>${item.product}</td>
                    <td><span class="tag-status ${statusClass}">${item.status}</span></td>
                    <td>
                        <button class="btn-action" title="Editar" onclick="editOrder('${code}', '${item.client}', '${item.product}', '${item.status}')">✏️</button>
                        <button class="btn-action" title="Excluir" onclick="deleteOrder('${code}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        // ✏️ PREENCHER FORMULÁRIO PARA EDITAR
        window.editOrder = function(code, client, product, status) {
            document.getElementById('os-code').value = code;
            document.getElementById('os-client').value = client;
            document.getElementById('os-product').value = product;
            document.getElementById('os-status').value = status;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 🗑️ EXCLUIR REPARO
        window.deleteOrder = function(code) {
            if (confirm(`Tem certeza que deseja excluir a ordem ${code}?`)) {
                db.collection("reparos").doc(code).delete()
                .then(() => alert(`Ordem ${code} excluída!`))
                .catch(err => alert("Erro ao excluir!"));
            }
        };
    </script>
</body>
</html>
